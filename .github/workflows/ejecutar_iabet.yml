name: IABET Cloud Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10,11,12,13,14,17,18,19 * * *'

jobs:
  escanear-partidos:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar tu codigo IABET
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.11 en la nube
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar ParlayAPI y Motor Matematico (Numba)
        run: pip install  parlay-api numba numpy pandas requests httpx

      - name: 4. Ejecutar Simulaciones y Enviar a Telegram
        run: python iabet_cloud.py
