name: IABET Cloud Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  escanear-partidos:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar codigo IABET
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar Motor Matematico (Numba) y Extractor Furtivo (Scrapling)
        run: |
          pip install --upgrade pip
          pip install numba numpy pandas requests "scrapling[fetchers]"
          scrapling install || true

      - name: 4. Limpiar Sintaxis y Ejecutar IABET Pro 3.0 (Quant + Ninja Edition)
        run: |
          python -c "p=open('iabet_cloud.py','rb').read().replace(b'\xc2\xa0',b' ').replace(b'\r\n',b'\n'); open('iabet_cloud.py','wb').write(p)"
          python iabet_cloud.py

      - name: 5. Auto-Guardar Auditoria, Inteligencia Ninja y Publicar Web
        run: |
          git config --global user.name "IABET Quant Bot"
          git config --global user.email "bot@iabet.cloud"
          git add index.html auditoria_iabet.json cache_odds_api.json ninjabet_intel.json || true
          git diff --staged --quiet || git commit -m "Auto-update: IABET Pro 3.0 Quant + Ninja Dutcher"
          git push
          
