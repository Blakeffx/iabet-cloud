import requests

def extraer_fijas_del_dia(candidatos_procesados):
    """
    Filtro estricto de cero error para 'Las Fijas':
    - Exclusivo TIER S (Blindado) o TIER A superior.
    - Prohibido incluir Faltas o Tarjetas por varianza arbitral.
    - Cuotas controladas (< 1.80) y Edge (+EV) verificado.
    """
    fijas = [
        p for p in candidatos_procesados
        if p.get("cat") not in ("FALTAS", "TARJETAS")
        and float(p.get("cuota", 99.0)) < 1.80
        and float(p.get("edge", 0.0)) >= 2.5
        and float(p.get("prob", 0.0)) >= 65.0
    ]

    fijas.sort(key=lambda x: (x.get("prob", 0.0), x.get("edge", 0.0)), reverse=True)
    seleccion = fijas[:2]

    if not seleccion:
        return (
            "🛡️ *DICTAMEN QUANT IABET: LAS FIJAS*\n"
            "━━━━━━━━━━━━━━━━━━━━\n"
            "⚠️ *Ningún partido de hoy supera los candados de seguridad (Hit-Rate ≥ 65% y Cuota < 1.80).*\n"
            "💰 *Veredicto:* NO APOSTAR (Stake S/ 0.00). Proteger el capital es prioridad matemática."
        )

    lineas = [
        "💎 *DICTAMEN OFICIAL: LAS FIJAS DE HOY*",
        "✅ *Filtro Anti-Trampa + Monte Carlo 1M + Sin Varianza Arbitral*",
        "━━━━━━━━━━━━━━━━━━━━"
    ]

    for idx, f in enumerate(seleccion, 1):
        lineas.append(
            f"🔥 *FIJA #{idx}:* `{f['partido']}`\n"
            f"🏆 *Torneo:* {f['liga']}\n"
            f"👉 *MERCADO DIRECTO:* `{f['mercado']}`\n"
            f"💵 *Cuota:* `@{f['cuota']:.2f}` _({f['casa']})_\n"
            f"📈 *Probabilidad Real:* `{f['prob']:.1f}%` | *Ventaja (+EV):* `+{f['edge']:.1f}%`\n"
            f"💰 *Stake Sugerido (Kelly):* *S/ {f['stake']:.2f}*\n"
        )

    if len(seleccion) == 2:
        c1, c2 = seleccion[0]["cuota"], seleccion[1]["cuota"]
        cuota_parlay = round(c1 * c2, 2)
        prob_parlay = (seleccion[0]["prob"] / 100.0) * (seleccion[1]["prob"] / 100.0) * 100.0
        lineas.append(
            "━━━━━━━━━━━━━━━━━━━━\n"
            f"🔗 *COMBINADA SEGURA (FIJA 1 + FIJA 2):*\n"
            f"• Cuota Total: `@{cuota_parlay:.2f}` | Prob. Conjunta: `{prob_parlay:.1f}%`\n"
            f"• Stake Sugerido: *S/ 2.00*"
        )

    return "\n".join(lineas)


def atender_comando_fijas(candidatos_procesados):
    """
    Inspecciona si enviaste '/fija' o '/fijas' en tu chat privado de Telegram
    y te envía el reporte directo al instante.
    """
    url_updates = f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/getUpdates?offset=-5"
    try:
        r = requests.get(url_updates, timeout=8)
        if r.status_code == 200:
            datos = r.json().get("result", [])
            for item in reversed(datos):
                msg = item.get("message", {})
                chat_id = str(msg.get("chat", {}).get("id", ""))
                texto = str(msg.get("text", "")).lower().strip()

                if chat_id == str(TELEGRAM_CHAT_ID) and any(cmd in texto for cmd in ["/fija", "/fijas", "fija"]):
                    mensaje_fijas = extraer_fijas_del_dia(candidatos_procesados)
                    enviar_telegram(mensaje_fijas)
                    break
    except Exception as e:
        print(f"Error procesando comando: {e}")
