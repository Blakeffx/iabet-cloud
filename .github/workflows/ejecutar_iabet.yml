name: IABET Cloud Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  escanear-partidos:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar tu codigo IABET
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.11 en la nube
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar ParlayAPI y Motor Matematico (Numba)
        run: pip install parlay-api numba numpy pandas requests

      - name: 4. Ejecutar Motor, Auditar con ESPN y Generar Web
        run: python iabet_cloud.py

      - name: 5. Guardar Auditoria y Actualizar Pagina Web en Vivo
        run: |
          git config --global user.name "IABET Quant Bot"
          git config --global user.email "bot@iabet.cloud"
          git add auditoria_iabet.json index.html
          git diff --staged --quiet || git commit -m "Auto-update: Auditoria ESPN + Web Dashboard"
          git push
