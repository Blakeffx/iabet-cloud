name: IABET Cloud Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  escanear-partidos:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar codigo IABET
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar Dependencias
        run: pip install numba numpy pandas requests

      - name: 4. Ejecutar Pipeline v19.1
        run: python iabet_cloud.py

      - name: 5. Publicar Cambios al Dashboard
        run: |
          git config --global user.name "IABET Bot"
          git config --global user.email "bot@iabet.cloud"
          git add index.html auditoria_iabet.json cache_odds_api.json || true
          git diff --staged --quiet || git commit -m "Auto-update: Dashboard v19.1"
          git push
